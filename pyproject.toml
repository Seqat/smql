[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smql-compiler"
version = "0.2.0"
description = "SeMantic Query Language compiler – compiles SMQL to safe parameterized SQL"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
smql = "smql_compiler.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
